spring.application.name=Ai_Social_Assistant
server.servlet.context-path=/api/v1
spring.banner.location=banner.txt
spring.config.import=optional:file:.env[.properties]

# ======================
# Database (Oracle)
# ======================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:ai_social_assistant}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ======================
# JWT (RSA, PEM PKCS#8 private / X.509 public)
# ======================
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ======================
# Swagger / OpenAPI
# ======================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

